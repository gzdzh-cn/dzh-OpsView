name: Publish verified native packages
on:
  push:
    branches: [codex/software-management]
    paths:
      - 'server/internal/executor/native.go'
      - 'server/internal/executor/install.go'
      - 'server/internal/executor/mysql_compat.go'
      - 'server/internal/executor/precompiled.go'
      - 'server/internal/executor/fast_package_test.go'
      - 'packages/catalog/versions.json'
      - '.github/native/**'
      - 'scripts/native-package*'
      - '.github/workflows/native-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:bookworm-slim, debian:trixie-slim]
        entry: [nginx-1.30.6, php-8.4.27, redis-8.10.3, postgresql-18.0, mysql-8.4.13, nodejs-22.23.5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: mkdir -p dist/native
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o ../dist/native-smoke.test ./internal/executor
        working-directory: server
      - name: Build and run real systemd service
        run: ./scripts/native-package-ci.sh
        env:
          NATIVE_IMAGE: ${{ matrix.image }}
          NATIVE_ENTRY: ${{ matrix.entry }}
          PACKAGE_MODE: build
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ strategy.job-index }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:bookworm-slim, debian:trixie-slim]
        entry: [nginx-1.30.6, php-8.4.27, redis-8.10.3, postgresql-18.0, mysql-8.4.13, nodejs-22.23.5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: native-build-*
          path: dist/native
          merge-multiple: true
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o ../dist/native-smoke.test ./internal/executor
        working-directory: server
      - name: Install binary on clean target, verify service and relocation
        run: ./scripts/native-package-ci.sh
        env:
          NATIVE_IMAGE: ${{ matrix.image }}
          NATIVE_ENTRY: ${{ matrix.entry }}
          PACKAGE_MODE: verify
      - name: Select acceptance report
        env:
          NATIVE_ENTRY: ${{ matrix.entry }}
          NATIVE_IMAGE: ${{ matrix.image }}
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          system={'ubuntu:22.04':'ubuntu-22.04','ubuntu:24.04':'ubuntu-24.04','debian:bookworm-slim':'debian-12','debian:trixie-slim':'debian-13'}[os.environ['NATIVE_IMAGE']]
          dest=pathlib.Path('dist/verified');dest.mkdir()
          name=f"{os.environ['NATIVE_ENTRY']}-{system}.tar.gz.json"
          shutil.copyfile(pathlib.Path('dist/native')/name,dest/name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-verified-${{ strategy.job-index }}
          path: dist/verified/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-build-*
          path: dist/packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-verified-*
          path: dist/reports
          merge-multiple: true
      - name: Generate catalog from all verified reports
        env:
          SOFTWARE_TAG: software-${{ github.run_id }}
        run: python3 scripts/native-package-catalog.py
      - name: Publish immutable software package release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOFTWARE_TAG: software-${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$SOFTWARE_TAG" >/dev/null 2>&1; then echo 'Software release already exists; refusing overwrite'; exit 1; fi
          gh api "repos/$GH_REPO/git/ref/tags/$SOFTWARE_TAG" >/dev/null || { echo "Create and push tag $SOFTWARE_TAG at $GITHUB_SHA, then re-run the publish job."; exit 1; }
          gh release create "$SOFTWARE_TAG" dist/packages/*.tar.gz dist/verified-catalog.json dist/native-acceptance.json --verify-tag --title "OpsView verified software $SOFTWARE_TAG" --notes '24 Linux amd64 system/software combinations verified with real systemd and protocol probes. Binary verification uses a fresh target system.' --prerelease --latest=false
