name: Publish verified native packages
on:
  push:
    branches: [codex/software-management]
    paths:
      - 'server/internal/executor/native.go'
      - 'server/internal/executor/install_permissions.go'
      - 'server/internal/executor/php_legacy.go'
      - 'server/internal/executor/install.go'
      - 'server/internal/executor/mysql_compat.go'
      - 'server/internal/executor/precompiled.go'
      - 'server/internal/executor/fast_package_test.go'
      - 'packages/catalog/versions.json'
      - 'packages/catalog/native-targets.json'
      - '.github/native/**'
      - 'scripts/native-package*'
      - '.github/workflows/native-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib
          target=json.loads(pathlib.Path('packages/catalog/native-targets.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('value='+json.dumps({'image':target['images'],'entry':target['entries']})+'\n')
          PYCODE
  build:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: mkdir -p dist/native
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -o ../dist/native-smoke.test ./internal/executor
        working-directory: server
      - name: Build and run real systemd service
        run: ./scripts/native-package-ci.sh
        env:
          NATIVE_IMAGE: ${{ matrix.image }}
          NATIVE_ENTRY: ${{ matrix.entry }}
          PACKAGE_MODE: build
      - name: Install binary on clean target, verify service and relocation
        run: ./scripts/native-package-ci.sh
        env:
          NATIVE_IMAGE: ${{ matrix.image }}
          NATIVE_ENTRY: ${{ matrix.entry }}
          PACKAGE_MODE: verify
      - uses: actions/upload-artifact@v4
        with:
          name: native-verified-${{ strategy.job-index }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-verified-*
          path: dist/packages
          merge-multiple: true
      - name: Generate catalog from all verified reports
        env:
          SOFTWARE_TAG: software-${{ github.run_id }}
        run: python3 scripts/native-package-catalog.py
      - name: Publish immutable software package release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOFTWARE_TAG: software-${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$SOFTWARE_TAG" >/dev/null 2>&1; then echo 'Software release already exists; refusing overwrite'; exit 1; fi
          gh api "repos/$GH_REPO/git/ref/tags/$SOFTWARE_TAG" >/dev/null || { echo "Create and push tag $SOFTWARE_TAG at $GITHUB_SHA, then re-run the publish job."; exit 1; }
          gh release create "$SOFTWARE_TAG" dist/packages/*.tar.gz dist/verified-catalog.json dist/native-acceptance.json --verify-tag --title "OpsView verified software $SOFTWARE_TAG" --notes 'Verified native Linux amd64 packages. Each system/software pair passes a real systemd start and protocol probe, followed by binary installation on a fresh target.' --prerelease --latest=false
