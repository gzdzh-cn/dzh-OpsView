name: Publish accepted software artifacts
on:
  push:
    tags: ['software-publish-*']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate original acceptance and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_REF_NAME#software-publish-}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$run_id" > /tmp/native-run.json
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all&per_page=100" > /tmp/native-jobs.json
          gh api "repos/$GH_REPO/git/ref/tags/software-$run_id" > /tmp/native-tag.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/native-run.json'))
          pages=json.load(open('/tmp/native-jobs.json'))
          jobs=[j for page in pages for j in page['jobs']]
          latest={}
          for j in jobs:
              if j['name'] not in latest or j['id'] > latest[j['name']]['id']:
                  latest[j['name']]=j
          tag=json.load(open('/tmp/native-tag.json'))
          assert run['path']=='.github/workflows/native-packages.yml'
          assert run['head_repository']['full_name']==os.environ['GH_REPO']
          assert tag['object']['sha']==run['head_sha']
          assert run['status']=='completed'
          group=[j for j in latest.values() if j['name'].startswith('build (')]
          targets=json.load(open('packages/catalog/native-targets.json'))
          assert len(group)==len(targets['entries'])*len(targets['images'])
          assert all(j['conclusion']=='success' for j in group), 'Every build and fresh-system verification must pass'
          assert not any(j['name'].startswith('verify (') for j in latest.values()), 'Use original workflow for legacy report formats'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"NATIVE_RUN={run['id']}\nSOFTWARE_TAG=software-{run['id']}\nNATIVE_SHA={run['head_sha']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.NATIVE_RUN }}
          pattern: native-verified-*
          path: dist/packages
          merge-multiple: true
      - name: Generate accepted catalog and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$NATIVE_SHA" python3 scripts/native-package-catalog.py
          if gh release view "$SOFTWARE_TAG" >/dev/null 2>&1; then echo 'Software release already exists; refusing overwrite'; exit 1; fi
          gh release create "$SOFTWARE_TAG" dist/packages/*.tar.gz dist/verified-catalog.json dist/native-acceptance.json --verify-tag --title "OpsView verified software $SOFTWARE_TAG" --notes 'All declared Linux amd64 targets passed source/official installation and independent clean-system binary verification with real systemd and protocol probes.' --prerelease --latest=false
