name: OpsView checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: ./scripts/test-installer.sh
      - run: ./scripts/test-files-linux.sh
      - run: bash scripts/test-security-linux.sh
      - name: Download verified Go modules with retry
        working-directory: server
        env:
          GODEBUG: http2client=0
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
      - run: make api check
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify log actions repeatedly in Chromium
        run: npm run test:e2e -- --grep 'software logs filter' --repeat-each=5
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: node scripts/container-smoke.mjs
      - run: ./scripts/linux-tests.sh ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim debian:trixie-slim
      - run: ./scripts/test-log-rotation.sh
      - run: ./scripts/test-php-session.sh
      - name: Verify UFW and firewalld with independent clients on four systems
        run: bash scripts/test-firewall-linux.sh
      - run: make release
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make release
      - name: Install Chromium for deployment browser verification
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Exercise real systemd installation and rollback
        run: sudo env GITHUB_ACTIONS=true bash scripts/test-deployment.sh

  websites:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: ./scripts/test-sites-linux.sh
