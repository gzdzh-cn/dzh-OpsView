name: Build candidate (no production update)
on:
  workflow_dispatch:
  push:
    branches: [codex/software-management]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make api check
      - run: ./scripts/test-installer.sh
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: ./scripts/linux-tests.sh ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim debian:trixie-slim
      - run: ./scripts/test-log-rotation.sh
      - run: ./scripts/test-php-session.sh
      - run: make release
      - run: sudo env GITHUB_ACTIONS=true bash scripts/test-deployment.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opsview-candidate-${{ github.sha }}
          path: |
            dist/opsview-linux-amd64.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: candidate-test-results
          path: web/test-results/
