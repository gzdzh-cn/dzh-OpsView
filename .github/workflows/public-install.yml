name: Verify published public installation

on:
  push:
    branches: ['codex/verify-public/**']
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify published default installation and ov update
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME##*/}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          sudo env GITHUB_ACTIONS=true RELEASE_TAG="$tag" python3 scripts/test-release-install.py
