name: Publish Linux release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash -c 'source ./install.sh; validate_version "$RELEASE_TAG"'
      - name: Verify displayed versions match tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          expected = os.environ['RELEASE_TAG'].removeprefix('v')
          assert pathlib.Path(f'docs/releases/{os.environ["RELEASE_TAG"]}.md').is_file()
          assert json.loads(pathlib.Path('web/package.json').read_text())['version'] == expected
          assert json.loads(pathlib.Path('web/package-lock.json').read_text())['version'] == expected
          assert json.loads(pathlib.Path('server/internal/api/openapi.json').read_text())['info']['version'] == expected
          assert re.search(r'const Current = "([^"]+)"', pathlib.Path('server/internal/version/version.go').read_text()).group(1) == expected
          PY
      - run: npm ci
        working-directory: web
      - name: Download verified Go modules with retry
        working-directory: server
        env:
          GODEBUG: http2client=0
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
      - run: make api check
      - run: ./scripts/test-installer.sh
      - run: ./scripts/test-files-linux.sh
      - name: Verify real SSH login and UFW rollback in isolated Linux
        run: bash scripts/test-security-linux.sh
      - name: Verify offline tests across supported Linux systems
        run: ./scripts/linux-tests.sh ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim debian:trixie-slim
      - run: ./scripts/test-sites-linux.sh
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Test SQL and Redis management in disposable Linux databases
        working-directory: server
        env:
          OPSVIEW_DATABASE_INTEGRATION: '1'
        run: go test ./internal/executor -run 'TestLive(Database|Redis)' -v -timeout 12m
      - name: Verify real script exit status and control group cancellation
        run: sudo env PATH="$PATH" OPSVIEW_SCHEDULE_INTEGRATION=1 go test ./internal/executor -run TestLiveScheduleScripts -v -timeout 2m
        working-directory: server
      - run: ./scripts/test-log-rotation.sh
      - run: ./scripts/test-php-session.sh
      - name: Verify UFW and firewalld with independent clients on four systems
        run: bash scripts/test-firewall-linux.sh
      - run: make release
      - name: Verify release checksums
        run: sha256sum --check SHA256SUMS
        working-directory: dist
      - name: Test navigation using the packaged panel binary
        run: npm run test:e2e
        working-directory: web
        env:
          OPSVIEW_E2E_RELEASE: 'true'
      - name: Exercise real systemd installation and rollback
        run: sudo env GITHUB_ACTIONS=true bash scripts/test-deployment.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opsview-release
          path: |
            dist/opsview-linux-amd64.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opsview-release
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state; then
            [ "$(cat draft-state)" = true ] || { echo 'Published releases are immutable in this workflow; use a new tag.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OpsView $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" opsview-linux-amd64.tar.gz SHA256SUMS install.sh --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
  verify-public-install:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify public installation and ov update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sudo env GITHUB_ACTIONS=true RELEASE_TAG="$RELEASE_TAG" python3 scripts/test-release-install.py
